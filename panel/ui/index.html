<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WSPanel</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt=""><span>WSPanel</span></div>
  <div id="switcher" class="switcher" role="tablist" aria-label="Cuenta"></div>
  <div class="top-actions">
    <span id="conn" class="conn" title="Conexión con el panel"><span class="dot"></span><span class="conn-text">Conectando…</span></span>
    <button id="btn-settings" class="icon-btn" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="board" class="board"></main>

<!-- Panel lateral: <dialog> modal nativo (página inerte, foco contenido,
     Esc / gesto atrás y el foco vuelve al botón que lo abrió). -->
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <header class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Cerrar">✕</button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
  <!-- avisos mientras el panel está abierto (lo de fuera queda inerte) -->
  <div id="drawer-status" class="drawer-status" role="status"></div>
  <footer class="drawer-foot" id="drawer-foot"></footer>
</dialog>

<!-- Avisos: siempre en el mismo sitio, como región con nombre. El anuncio a
     lectores de pantalla va por ariaNotify() o por las regiones live ocultas. -->
<div id="toasts" role="region" aria-label="Notificaciones"></div>
<div class="visually-hidden" aria-live="polite" id="announce-polite"></div>
<div class="visually-hidden" aria-live="assertive" id="announce-assertive"></div>
<dialog id="confirm" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="row end">
      <!-- autofocus en la acción segura: un Enter accidental no descarta nada -->
      <button value="cancel" class="btn ghost" autofocus>Cancelar</button>
      <button value="ok" class="btn danger" id="confirm-ok">Confirmar</button>
    </div>
  </form>
</dialog>
<script src="js/dom.js"></script>
<script src="js/api.js"></script>
<script src="js/rules.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
